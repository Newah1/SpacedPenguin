name: Apply BlackHole Integration

on:
  push:
    branches:
      - feature/blackhole-integration

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/blackhole-integration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration changes
        run: node tools/apply-blackhole-integration.mjs
      - name: Commit integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete BlackHole integration" || exit 0
          git push origin HEAD:feature/blackhole-integration
