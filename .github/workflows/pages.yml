name: Deploy to GitHub Pages

# Deploys the static game (SPA) to GitHub Pages. The community level/high-score
# server is intentionally not part of this deployment: app-config.js keeps
# levelServer.baseUrl = null, so the site runs fully local-only.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and stage static site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up Rust for generated contracts and Wasm
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Install dependencies
        run: npm ci

      - name: Verify generated domain contracts
        run: npm run check:domain

      - name: Build packaged Wasm simulator
        run: npm run build:simulator-wasm

      - name: Verify packaged Wasm simulator
        run: test -s rust/simulator/pkg/spaced_penguin_simulator.wasm

      - name: Validate shipped and manual levels
        run: node testing/validateLevels.js

      - name: Check JavaScript syntax
        run: node testing/checkSyntax.js

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stage production files
        run: |
          mkdir -p _site
          cp index.html app-config.js _site/
          cp -R css js assets levels generated _site/
          mkdir -p _site/rust/simulator/pkg
          cp rust/simulator/pkg/spaced_penguin_simulator.wasm _site/rust/simulator/pkg/
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
