name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Node quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust for generated contracts and Wasm
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Verify generated domain contracts
        run: npm run check:domain

      - name: Build packaged Wasm simulator
        run: npm run build:simulator-wasm

      - name: Build native headless simulator
        run: npm run build:simulator-native

      - name: Upload verified Wasm simulator
        uses: actions/upload-artifact@v5
        with:
          name: simulator-wasm
          path: rust/simulator/pkg/spaced_penguin_simulator.wasm
          if-no-files-found: error

      - name: Check generated Rust simulator models
        run: cargo test --manifest-path rust/simulator/Cargo.toml

      - name: Run Node regression tests
        run: npm run test:unit

      - name: Run community server tests
        run: npm run test:server

      - name: Enforce configuration policy
        run: npm run test:policy

      - name: Validate shipped levels
        run: npm run test:levels

      - name: Verify original level ports
        run: npm run test:original-levels

      - name: Check JavaScript syntax
        run: npm run test:syntax

  browser:
    name: Chromium smoke tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Remove checkout Wasm simulator
        run: rm -f rust/simulator/pkg/spaced_penguin_simulator.wasm

      - name: Download verified Wasm simulator
        uses: actions/download-artifact@v5
        with:
          name: simulator-wasm
          path: rust/simulator/pkg

      - name: Verify downloaded Wasm simulator
        run: test -s rust/simulator/pkg/spaced_penguin_simulator.wasm

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
