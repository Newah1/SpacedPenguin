name: Architecture cleanup once

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/architecture-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: npm

      - run: npm ci

      - name: Apply architecture cleanup
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))

          # GameState is a leaf module; consumers must not import it through Game.
          for path in ['js/levelLoader.js', 'js/levelEditor.js', 'js/inputActions.js']:
              replace(path, "import { GameState } from './game.js';", "import { GameState } from './gameState.js';")

          # The registry itself defines the editor palette. A new editable descriptor
          # no longer needs a parallel class list injected by Game.
          replace(
              'js/gameObjectRegistry.js',
              "export function listEditableRuntimeClassNames(gameObjectClasses = {}) {\n    return Object.keys(gameObjectClasses)\n        .filter(className => getGameObjectDefinition(className).editable)\n        .sort();\n}",
              "export function listEditableRuntimeClassNames() {\n    return Object.values(GAME_OBJECT_DEFINITIONS)\n        .filter(definition => definition.editable && definition.type !== LevelObjectType.PENGUIN)\n        .map(definition => definition.className)\n        .sort();\n}"
          )

          replace(
              'js/game.js',
              "        // Pass ALL class references to level editor for object creation\n        this.levelEditor.gameObjectClasses = {\n            Planet,\n            BlackHole,\n            Bonus,\n            BonusPopup,\n            Target,\n            Arrow,\n            Slingshot,\n            TextObject,\n            PointingArrow,\n            Portal\n        };\n        \n",
              ''
          )

          # gameObjects is the canonical runtime membership list. Typed collections
          # are indexes maintained by RuntimeObjectMembership, not export fallbacks.
          replace(
              'js/game.js',
              "    getAllObjectsForExport() {\n        const allObjects = new Set(); // Use Set to avoid duplicates\n        \n        // Add from gameObjects array\n        this.gameObjects.forEach(obj => {\n            if (this.shouldExportObject(obj)) {\n                allObjects.add(obj);\n            }\n        });\n        \n        // Add from specific arrays (in case something's missing from gameObjects)\n        this.planets.forEach(obj => allObjects.add(obj));\n        this.bonuses.forEach(obj => allObjects.add(obj));\n        this.portals.forEach(obj => allObjects.add(obj));\n        this.textObjects.forEach(obj => allObjects.add(obj));\n        this.pointingArrows.forEach(obj => allObjects.add(obj));\n        \n        // Add penguin if it exists\n        if (this.penguin && this.shouldExportObject(this.penguin)) {\n            allObjects.add(this.penguin);\n        }\n        \n        plog.debug('Objects found in arrays:');\n        plog.debug('- gameObjects:', this.gameObjects.length);\n        plog.debug('- planets:', this.planets.length);\n        plog.debug('- bonuses:', this.bonuses.length);\n        plog.debug('- textObjects:', this.textObjects.length);\n        plog.debug('- pointingArrows:', this.pointingArrows.length);\n        plog.debug('- penguin:', this.penguin ? 1 : 0);\n        \n        return Array.from(allObjects);\n    }",
              "    getAllObjectsForExport() {\n        return this.gameObjects.filter(obj => this.shouldExportObject(obj));\n    }"
          )

          # The object membership descriptor should state the corresponding legacy
          # physics index explicitly; no naming convention/pluralization is needed.
          replace(
              'js/gameObjectRegistry.js',
              "        physicsAdd: 'addPlanet', physicsRemove: 'removePlanet',",
              "        physicsAdd: 'addPlanet', physicsRemove: 'removePlanet', physicsCollection: 'planets',",
              count=2
          )
          replace(
              'js/gameObjectRegistry.js',
              "        physicsAdd: 'addBonus', physicsRemove: 'removeBonus',",
              "        physicsAdd: 'addBonus', physicsRemove: 'removeBonus', physicsCollection: 'bonuses',"
          )
          replace(
              'js/gameObjectRegistry.js',
              "        physicsAdd: base.physicsAdd,\n        physicsRemove: base.physicsRemove,",
              "        physicsAdd: base.physicsAdd,\n        physicsRemove: base.physicsRemove,\n        physicsCollection: base.physicsCollection || null,"
          )

          # RuntimeObjectMembership now consumes descriptor metadata directly.
          p = Path('js/runtimeObjectMembership.js')
          text = p.read_text()
          old = "const PHYSICS_COLLECTION_BY_ADD_METHOD = Object.freeze({\n    addPlanet: 'planets',\n    addBonus: 'bonuses'\n});\n\nfunction physicsCollectionName(definition) {\n    return definition.physicsCollection || PHYSICS_COLLECTION_BY_ADD_METHOD[definition.physicsAdd] || null;\n}"
          new = "function physicsCollectionName(definition) {\n    return definition.physicsCollection || null;\n}"
          if text.count(old) != 1:
              raise SystemExit('runtimeObjectMembership.js: unexpected physics collection helper')
          p.write_text(text.replace(old, new, 1))

          # Keep the canonical architecture reference aligned with the optional
          # community server and the consolidated object registry.
          replace('ARCHITECTURE.md', '**Last verified:** 2026-08-23 against the repository source', '**Last verified:** 2026-08-25 against the repository source')
          replace(
              'ARCHITECTURE.md',
              "Spaced Penguin is a client-only, static web game. The browser loads one HTML page and an ES-module graph; there is no build step, application server, database, or current network API beyond static-file `fetch` calls.",
              "Spaced Penguin is a browser-first static web game with an optional Node/SQLite community service for publishing levels and replay-verified leaderboards. The browser client loads one HTML page and a native ES-module graph with no build step; ordinary play still works from a static host without the community service."
          )
          replace(
              'ARCHITECTURE.md',
              "| High score | Browser `localStorage` | No online leaderboard or remote score submission exists in the rewrite. |",
              "| High scores | Browser `localStorage` and optional community API | Local boards remain browser-owned; community levels can submit replay-verified scores to the configured server. |"
          )
          replace(
              'ARCHITECTURE.md',
              "| Exported level | Downloaded JSON | Export and Ctrl+S are client-side JSON downloads; there is no server persistence. |",
              "| Exported/published level | Downloaded JSON, browser storage, or optional community API | Export remains client-side; owned levels can be saved locally and completed levels can be published when a community server is configured. |"
          )
          replace(
              'ARCHITECTURE.md',
              "There is no runtime bundler, transpiler, production package dependency, service worker, backend, authentication, or telemetry service.",
              "The browser client has no runtime bundler, transpiler, production package dependency, service worker, authentication, or telemetry service. The optional community backend is a separate Node/SQLite process and is not required for static-host gameplay."
          )
          replace(
              'ARCHITECTURE.md',
              "| `LevelObjectVocabulary` / `LevelSchema` | Dependency-free type vocabulary and normalized level format | Registry, validator, loader, editor | Vocabulary owns canonical object/orbit/camera names and aliases; schema derives object defaults and capabilities from the domain registry and normalizes definitions. |",
              "| `GameObjectRegistry` / `LevelObjectVocabulary` / `LevelSchema` | Canonical object descriptors plus normalized level format | Validator, loader, editor, runtime membership/serialization | The registry owns serialized object types, aliases, defaults, capabilities, validation/construction/editor/serialization hooks; vocabulary owns non-object orbit/camera enums; schema normalizes definitions. |"
          )

          # Delete this one-shot workflow in the same commit it produces.
          Path('.github/workflows/architecture-cleanup-once.yml').unlink()

      - name: Run regression suite
        run: |
          npm run test:unit
          npm run test:policy
          npm run test:levels
          npm run test:original-levels
          npm run test:syntax

      - name: Commit cleanup
        run: |
          git config user.name "Spaced Penguin Architecture Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete architecture cleanup"
          git push origin HEAD:master
