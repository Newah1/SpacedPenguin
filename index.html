<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Spaced Penguin</title>
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background:
                radial-gradient(circle at 50% 45%, #122b68 0, #071531 38%, #020611 72%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Trebuchet MS", Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        
        #gameContainer {
            position: relative;
            border: 2px solid #264f92;
            border-radius: 10px;
            background: #000;
            box-shadow:
                0 0 0 1px #091631,
                0 0 30px rgba(28, 98, 210, 0.32),
                0 22px 70px rgba(0, 0, 0, 0.8);
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* Mobile responsive adjustments */
        @media screen and (max-width: 768px) {
            #gameContainer {
                min-width: 300px;
                min-height: 200px;
                border: none;
                width: 100vw;
                height: 100vh;
            }
            
            body {
                padding: 0;
                margin: 0;
            }
        }
        
        /* Landscape mobile adjustments */
        @media screen and (max-width: 1024px) and (orientation: landscape) {
            #gameContainer {
                width: 100vw;
                height: 100vh;
            }
        }
        
        #gameCanvas {
            display: block;
            background: #000;
            border-radius: 8px;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            color: rgb(72, 247, 72);
            font-size: 16px;
            z-index: 10;
            justify-content: space-between;
            width: calc(100% - 20px);
            flex-wrap: wrap;
        }

        body.is-menu #ui {
            display: none;
        }
        
        #ui div {
            margin: 5px 0;
            font-size: 14px;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 20;
        }
        
        /* Mobile-specific styles */
        @media (max-width: 768px) {
            #gameContainer {
                width: 100vw;
                height: 100vh;
                border: none;
                min-width: unset;
                min-height: unset;
            }
            
            #gameCanvas {
                width: 100vw;
                height: 100vh;
            }
            
            #ui {
                font-size: 12px;
                flex-direction: column;
                gap: 5px;
            }
            
            #ui div {
                font-size: 12px;
                margin: 2px 0;
            }
            
            #volumeSlider {
                width: 60px !important;
            }
        }
        
        /* Prevent text selection on mobile */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* Mobile control buttons */
        .mobile-control-button {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Prevent zoom on double tap */
        * {
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>Level: <span id="level">1</span></div>
            <div>Score: <span id="score">0</span></div>
            <div>Distance: <span id="distance">0</span></div>
            <div>Tries: <span id="tries">0</span></div>
            <div>Volume: <input type="range" id="volumeSlider" min="0" max="100" value="70" style="width: 80px;"> <span id="volumeValue">70%</span></div>
        </div>
        <div id="loading">Loading...</div>
    </div>
    
    <!-- Game JavaScript files -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
