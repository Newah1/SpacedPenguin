<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Spaced Penguin</title>
    <style>
        :root {
            --page-space-inner: #122b68;
            --page-space-mid: #071531;
            --page-space-outer: #020611;
            --game-border: #264f92;
            --game-background: #000;
            --hud-color: rgb(72, 247, 72);
            --panel-radius: 10px;
            --mobile-breakpoint: 768px; /* Mirrored by RESPONSIVE_CONFIG for media queries. */
        }

        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            background:
                radial-gradient(
                    circle at 50% 45%,
                    var(--page-space-inner) 0,
                    var(--page-space-mid) 38%,
                    var(--page-space-outer) 72%,
                    var(--game-background) 100%
                );
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: "Trebuchet MS", Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }
        
        #gameContainer {
            position: relative;
            border: 2px solid var(--game-border);
            border-radius: var(--panel-radius);
            background: var(--game-background);
            box-shadow:
                0 0 0 1px #091631,
                0 0 30px rgba(28, 98, 210, 0.32),
                0 22px 70px rgba(0, 0, 0, 0.8);
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        /* Mobile responsive adjustments */
        @media screen and (max-width: 768px) {
            #gameContainer {
                min-width: 300px;
                min-height: 200px;
                border: none;
                width: 100vw;
                height: 100vh;
            }
            
            body {
                padding: 0;
                margin: 0;
            }
        }
        
        /* Landscape mobile adjustments */
        @media screen and (max-width: 1024px) and (orientation: landscape) {
            #gameContainer {
                width: 100vw;
                height: 100vh;
            }
        }
        
        #gameCanvas {
            display: block;
            background: var(--game-background);
            border-radius: 8px;
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            color: var(--hud-color);
            font-size: 16px;
            z-index: 10;
            width: calc(100% - 20px);
            contain: layout paint style;
            font-variant-numeric: tabular-nums;
        }

        body.is-menu #ui {
            display: none;
        }
        
        #ui div {
            margin: 5px 0;
            font-size: 14px;
        }
        
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            z-index: 20;
        }

        #simulationSpeedButton {
            --button-bg: rgba(2, 12, 28, 0.88);
            --button-hover: rgba(20, 46, 74, 0.96);
            --button-active: rgba(72, 247, 72, 0.9);
            --button-fg: var(--hud-color);
            --button-border: rgba(72, 247, 72, 0.72);
            position: absolute;
            right: 18px;
            bottom: 18px;
            z-index: 12;
            display: none;
            min-width: 64px;
            min-height: 44px;
            padding: 8px 13px;
            border-radius: 22px;
            font: 800 16px/1 "Trebuchet MS", Arial, sans-serif;
            letter-spacing: 0.04em;
            touch-action: manipulation;
            box-shadow: 0 0 12px rgba(72, 247, 72, 0.18);
        }

        #simulationSpeedButton.is-active {
            --button-bg: var(--hud-color);
            --button-hover: #8aff8a;
            --button-fg: #031124;
            box-shadow: 0 0 18px rgba(72, 247, 72, 0.65);
        }

        #simulationSpeedButton:focus-visible {
            outline: 3px solid white;
            outline-offset: 3px;
        }

        #menuSettingsButton {
            --button-bg: #fff3bb;
            --button-hover: #fff9d7;
            --button-fg: #c95616;
            --button-border: #f79433;
            position: absolute;
            right: 4%;
            bottom: 5%;
            z-index: 110;
            display: none;
            min-width: 150px;
            padding: 12px 20px;
            border-radius: 24px;
            font: 900 16px/1 "Trebuchet MS", Arial, sans-serif;
            letter-spacing: .08em;
            box-shadow: 0 0 0 2px #ffca69;
            touch-action: manipulation;
        }

        body.is-menu #menuSettingsButton { display: block; }

        .settings-overlay {
            position: absolute;
            inset: 0;
            z-index: 300;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(0, 0, 0, .82);
            color: #fff6d6;
            pointer-events: auto;
            touch-action: manipulation;
        }

        .settings-panel {
            width: min(520px, 92%);
            max-height: 90%;
            overflow-y: auto;
            padding: 28px;
            border: 4px solid #cb7928;
            border-radius: 14px;
            background: #211b18;
            box-shadow: 0 18px 60px rgba(0, 0, 0, .7);
        }

        .settings-panel h2 {
            margin: 0 0 20px;
            color: #f5e4aa;
            text-align: center;
            letter-spacing: .12em;
        }

        .settings-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: center;
            gap: 24px;
            min-height: 72px;
            padding: 14px 4px;
            border-top: 1px solid rgba(233, 194, 122, .3);
        }

        .settings-copy { display: grid; gap: 5px; }
        .settings-copy strong { font-size: 17px; }
        .settings-copy small { color: #d3c5a9; line-height: 1.35; }
        .settings-row input[type="checkbox"] { width: 25px; height: 25px; accent-color: #cb7928; }
        .settings-range-control { display: flex; align-items: center; gap: 12px; }
        .settings-range-control input { width: 170px; accent-color: #cb7928; }
        .settings-range-control output { min-width: 42px; font-variant-numeric: tabular-nums; }

        .settings-close-button {
            display: block;
            min-width: 150px;
            margin: 24px auto 0;
            padding: 12px 20px;
            border: 2px solid #e9c27a;
            background: #4b3b32;
            color: #fff6d6;
            font: 800 15px "Trebuchet MS", Arial, sans-serif;
            cursor: pointer;
        }
        
        /* Mobile-specific styles */
        @media (max-width: 768px) {
            #gameContainer {
                width: 100vw;
                height: 100vh;
                border: none;
                min-width: unset;
                min-height: unset;
            }
            
            #gameCanvas {
                width: 100vw;
                height: 100vh;
            }
            
            #ui {
                font-size: 12px;
                display: flex;
                flex-direction: column;
                gap: 5px;
            }
            
            #ui div {
                font-size: 12px;
                margin: 2px 0;
            }
            
        }
        
        /* Prevent text selection on mobile */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* Mobile control buttons */
        .mobile-control-button {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Prevent zoom on double tap */
        * {
            touch-action: manipulation;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <button id="menuSettingsButton" class="spaced-button" type="button">SETTINGS</button>
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>Level: <span id="level">1</span></div>
            <div>Score: <span id="score">0</span></div>
            <div>Distance: <span id="distance">0</span></div>
            <div>Tries: <span id="tries">0</span></div>
        </div>
        <button id="simulationSpeedButton" class="spaced-button" type="button" aria-label="Toggle double simulation speed" aria-pressed="false">▶▶ 2×</button>
        <div id="loading">Loading...</div>
    </div>
    
    <!-- Game JavaScript files -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
